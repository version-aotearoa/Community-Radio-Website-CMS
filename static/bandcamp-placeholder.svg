<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Bandcamp">
	<!-- Placeholder art for Bandcamp tracks that have no cover: a quiet monochrome
	     "bc" tile in the site's palette, so a linked track with no artwork still
	     reads as a Bandcamp track rather than an empty box. -->
	<rect x="0.5" y="0.5" width="99" height="99" fill="#141313" stroke="#e5e2e1" stroke-width="1" />
	<text
		x="50"
		y="52"
		text-anchor="middle"
		dominant-baseline="middle"
		font-family="Helvetica, Arial, sans-serif"
		font-size="44"
		font-weight="700"
		letter-spacing="-2"
		fill="#e5e2e1"
	>bc</text>
</svg>
